<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Asistente driver</title>
  <style>
    :root { color-scheme: light; }
    body { margin: 0; font: 16px/1.4 system-ui, sans-serif; background: #f4f5f7; color: #1c1c1c; }
    header { padding: 16px 20px; background: #111; color: #fff; }
    header p { margin: 4px 0 0; color: #c8c8c8; font-size: 14px; }
    main { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 16px; }
    section { background: #fff; border-radius: 12px; padding: 16px; }
    h2 { margin: 0 0 12px; font-size: 16px; }
    .fixtures { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    button { border: 0; border-radius: 8px; padding: 8px 12px; background: #e7e7ea; cursor: pointer; }
    button.trial { background: #fff7e6; outline: 1px dashed #c48a00; }
    .ocr { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
    .preview { display: none; width: 72px; height: 72px; object-fit: cover; border-radius: 8px; }
    .preview.show { display: block; }
    #ocr-status.busy { color: #8a5a00; }
    #ocr-status.busy::after { content: ""; display: inline-block; width: 8px; height: 8px; margin-left: 6px; border-radius: 50%; background: #c48a00; animation: pulse 0.8s infinite; }
    #ocr-status.done { color: #0d6b3c; }
    #elapsed, #elapsed-ia { font-weight: 700; font-variant-numeric: tabular-nums; min-width: 4.5em; }
    @keyframes pulse { 50% { opacity: 0.2; } }
    button.primary { background: #111; color: #fff; }
    textarea { width: 100%; min-height: 320px; box-sizing: border-box; border: 1px solid #d0d0d4; border-radius: 8px; padding: 10px; font: 13px/1.4 ui-monospace, monospace; }
    .error { color: #9b1c1c; }
    article { border: 1px solid #e4e4e7; border-radius: 10px; padding: 12px; margin-bottom: 10px; }
    .decision { display: inline-block; border-radius: 999px; padding: 2px 10px; font-weight: 700; margin-right: 8px; }
    .aceptar { background: #d9f5e5; color: #0d6b3c; }
    .negociar { background: #fff3d6; color: #8a5a00; }
    .parcial { background: #ececef; color: #444; }
    .no { background: #fde2e2; color: #9b1c1c; }
    article.reduced { display: flex; gap: 6px; align-items: stretch; padding: 8px; }
    .reduced .field {
      flex: 1 1 0;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 2px;
      border: 0;
      border-radius: 10px;
      margin: 0;
      padding: 8px 4px;
      font: 700 13px/1.2 system-ui, sans-serif;
      text-align: center;
      cursor: default;
    }
    .reduced .field small { font-size: 10px; font-weight: 650; letter-spacing: 0.03em; text-transform: uppercase; opacity: 0.8; }
    .reduced .field.usuario { background: transparent; color: #000; appearance: none; }
    .reduced .field .km { font-size: 11px; font-weight: 650; letter-spacing: 0; text-transform: none; opacity: 0.9; }
    .field.seg-verde { background: #d9f5e5; color: #0d6b3c; }
    .field.seg-amarillo { background: #fff3d6; color: #8a5a00; }
    .field.seg-rojo { background: #fde2e2; color: #9b1c1c; }
    .field.seg-none, .field.inc-none { background: #ececef; color: #444; }
    .field.inc-plana { background: #e5f7f4; color: #0c6b62; }
    .field.inc-media { background: #e7f0fb; color: #1d4e89; }
    .field.inc-alta { background: #ffe8d6; color: #9a4b08; }
    .field.viaje, .field.distancia { background: #eef1f4; color: #1c1c1c; }
    .meta { color: #555; font-size: 14px; margin: 6px 0; }
    .context { display: grid; grid-template-columns: 140px 1fr; gap: 8px; align-items: center; margin-bottom: 12px; }
    .context label { font-size: 14px; }
    .context input, .context select { border: 1px solid #d0d0d4; border-radius: 8px; padding: 8px; font: inherit; }
    @media (max-width: 800px) {
      main { grid-template-columns: 1fr; }
      article.reduced { gap: 4px; padding: 6px; }
      .reduced .field { font-size: 12px; padding: 8px 3px; }
    }
  </style>
</head>
<body>
  <header>
    <strong>Asistente driver</strong>
    <p>Pega el texto de la captura o carga una de las cuatro pantallas.</p>
  </header>
  <main>
    <section>
      <h2>Captura</h2>
      <div class="context">
        <label for="mode">Modo</label>
        <select id="mode">
          <option value="saliendo">Saliendo</option>
          <option value="en_zona_prime">En zona prime</option>
          <option value="retornando">Retornando</option>
        </select>
        <label for="home">Casa</label>
        <input id="home" type="text" placeholder="Barrio o municipio">
        <label for="prime">Zona prime</label>
        <input id="prime" type="text" value="Itagüí, Sabaneta, Poblado, Laureles, Belén, Envigado">
        <label for="distant">Zona alejada</label>
        <input id="distant" type="text" placeholder="Opcional, separada por comas">
      </div>
      <div id="fixtures" class="fixtures"></div>
      <div class="ocr">
        <label for="ocr-mode">OCR</label>
        <select id="ocr-mode">
          <option value="remoto" selected>Remoto</option>
          <option value="local">Local</option>
        </select>
        <label for="compacto">Compacto</label>
        <select id="compacto">
          <option value="false" selected>false</option>
          <option value="true">true</option>
        </select>
        <label for="vista">Vista</label>
        <select id="vista">
          <option value="linea" selected>Linea</option>
          <option value="reducida">Reducida</option>
          <option value="completa">Completa</option>
        </select>
        <button id="phone" class="trial" type="button">Teléfono</button>
        <button id="ocr" class="trial" type="button">Imagen (prueba)</button>
        <input id="image" type="file" accept="image/*" hidden>
        <img id="preview" class="preview" alt="">
        <span id="ocr-status"></span>
        <span id="elapsed"></span>
        <span id="elapsed-ia" hidden></span>
      </div>
      <textarea id="text" placeholder="Texto OCR"></textarea>
      <p>
        <button id="analyze" class="primary" type="button">Analizar</button>
        <button id="clear" type="button">Clear</button>
      </p>
      <p id="error" class="error"></p>
    </section>
    <section>
      <h2>Decisión</h2>
      <div id="result"></div>
    </section>
  </main>
  <script>
    const text = document.querySelector("#text");
    const result = document.querySelector("#result");
    const error = document.querySelector("#error");
    const screens = {
      uber_sheet: "Uber",
      indrive_list: "inDrive",
      didi_list: "DiDi lista",
      didi_modal: "DiDi emergente",
      unknown: "No reconocida"
    };
    const decisions = { aceptar: "SI", negociar: "Negociar", parcial: "Parcial", no: "NO" };
    const labels = { oferta: "Oferta", justo: "Justo", optimo: "Óptimo" };
    const safety = { rojo: "Rojo", amarillo: "Amarillo", verde: "Verde" };
    const incline = { muy_alta: "Muy alta", alta: "Alta", media: "Media", plana: "Plana" };
    const money = new Intl.NumberFormat("es-CO", { style: "currency", currency: "COP", maximumFractionDigits: 0 });

    function line(label, value) {
      const p = document.createElement("p");
      p.className = "meta";
      p.textContent = value == null || value === "" ? label + ": sin dato" : label + ": " + value;
      return p;
    }

    function evaluated(label, value) {
      const p = document.createElement("p");
      p.className = "meta";
      p.textContent = value ? label + ": " + value : label + ": Sin evaluación";
      return p;
    }

    function badge(item) {
      const el = document.createElement("span");
      el.className = "decision " + item.decision;
      el.textContent = decisions[item.decision] || item.decision;
      return el;
    }

    function safetyText(item) {
      if (!item.safety) return null;
      return safety[item.safety] + (item.sector ? " (" + item.sector + ")" : "");
    }

    function field(kind, label, value) {
      const el = document.createElement("button");
      el.type = "button";
      el.className = "field " + kind;
      if (label) {
        const cap = document.createElement("small");
        cap.textContent = label;
        el.append(cap);
      }
      el.append(document.createTextNode(value));
      return el;
    }

    function captureDistance(offer) {
      const pickup = offer.pickupKm == null ? null : kmBit(offer.pickupKm, true);
      const trip = offer.tripKm != null && !offer.tripKmFromRoute ? kmBit(offer.tripKm, false) : null;
      if (trip && pickup) return trip + " / " + pickup;
      return pickup || trip;
    }

    function usuarioText(item) {
      if (item.offer.passengerName) return item.offer.passengerName;
      if (item.offer.priceCop) return money.format(item.offer.priceCop);
      return "sin dato";
    }

    function legText(min, km, approx) {
      const kmText = km == null ? null : kmBit(km, approx);
      const minText = typeof min === "number" ? min + " min" : min || null;
      if (minText && kmText) return minText + " (" + kmText + ")";
      return kmText || minText;
    }

    function viajeExtra(offer) {
      const age = offer.offerAge && /min/i.test(offer.offerAge) ? offer.offerAge.replace(/\.$/, "") : null;
      const pickupMin = offer.pickupMin != null ? offer.pickupMin : offer.tripMin == null ? age : null;
      const pickup = legText(pickupMin, offer.pickupKm, offer.app === "indrive");
      const trip = offer.tripKmFromRoute ? null : legText(offer.tripMin, offer.tripKm, false);
      if (trip) return { kind: "viaje", label: "Viaje", value: pickup ? pickup + " · " + trip : trip };
      if (pickup) return { kind: "distancia", label: "Distancia", value: pickup };
      return null;
    }

    function lineaCard(item) {
      const card = document.createElement("article");
      card.className = "reduced";
      const decision = field("decision " + item.decision, "", decisions[item.decision] || item.decision);
      const km = captureDistance(item.offer);
      if (km) {
        const dist = document.createElement("small");
        dist.className = "km";
        dist.textContent = km;
        decision.append(dist);
      }
      card.append(
        field("usuario", "", usuarioText(item)),
        decision,
        field("seg-" + (item.safety || "none"), "Seguridad", safety[item.safety] || "Sin evaluación"),
        field("inc-" + (item.incline || "none"), "Inclinación", incline[item.incline] || "Sin evaluación"),
      );
      const extra = viajeExtra(item.offer);
      if (extra) card.append(field(extra.kind, extra.label, extra.value));
      return card;
    }

    const kmFormat = new Intl.NumberFormat("es-CO", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
    const pesos = new Intl.NumberFormat("en-US", { maximumFractionDigits: 0 });
    function kmBit(value, approx) {
      if (value == null) return null;
      return (approx ? "~" : "") + kmFormat.format(value) + " km";
    }
    function distanceText(offer) {
      const trip = kmBit(offer.tripKm, false);
      const pickup = kmBit(offer.pickupKm, true);
      if (trip && pickup) return trip + " / " + pickup;
      return trip || pickup || "sin dato";
    }
    function priceText(suggested) {
      if (!suggested) return "sin dato";
      const bit = (label, amount) => label + ": " + (amount == null ? "sin dato" : "$" + pesos.format(amount));
      return [bit("Oferta", suggested.oferta), bit("Justo", suggested.justo), bit("Extra", suggested.extra)].join(" | ");
    }

    function reducedCard(item) {
      const card = document.createElement("article");
      const name = document.createElement("p");
      name.textContent = item.offer.passengerName || "sin dato";
      const row = document.createElement("p");
      row.append(badge(item));
      row.append(document.createTextNode(
        " Distancia: " + distanceText(item.offer) +
        "   Seguridad: " + (safetyText(item) || "Sin evaluación") +
        "   Inclinación: " + (incline[item.incline] || "Sin evaluación") +
        "   Precios: " + priceText(item.suggested)
      ));
      card.append(name, row);
      return card;
    }

    let lastData = null;
    function render(data) {
      lastData = data;
      result.replaceChildren();
      const head = document.createElement("p");
      head.className = "meta";
      head.textContent = "Pantalla: " + (screens[data.screen] || data.screen);
      result.append(head);
      if (!data.offers.length) {
        const empty = document.createElement("p");
        empty.textContent = "No hay ofertas.";
        result.append(empty);
        return;
      }
      const compact = document.querySelector("#compacto").value === "true";
      const vista = document.querySelector("#vista").value;
      for (const item of data.offers) {
        if (vista === "linea") {
          result.append(lineaCard(item));
          continue;
        }
        if (vista === "reducida") {
          result.append(reducedCard(item));
          continue;
        }
        const card = document.createElement("article");
        if (compact) {
          card.append(badge(item));
          card.append(line("Usuario", item.offer.passengerName));
          card.append(line("Origen", item.offer.origin));
          card.append(line("Destino", item.offer.destination));
          card.append(evaluated("Sector", item.sector));
          card.append(evaluated("Seguridad", safety[item.safety]));
          card.append(evaluated("Inclinación", incline[item.incline]));
          result.append(card);
          continue;
        }
        card.append(badge(item));
        const offer = item.offer;
        if (offer.passengerName) card.append(line("Usuario", offer.passengerName));
        card.append(line("App", offer.app));
        card.append(line("Precio", money.format(offer.priceCop)));
        card.append(line("Recogida", offer.pickupKm == null ? null : offer.pickupKm + " km"));
        card.append(line("Viaje", offer.tripKm == null ? null : offer.tripKm + " km" + (offer.tripKmFromRoute ? " (ruta)" : "")));
        card.append(line("Origen", offer.origin));
        card.append(line("Destino", offer.destination));
        card.append(line("Precio/km", item.pricePerKm == null ? null : money.format(item.pricePerKm)));
        card.append(line("Etiqueta", labels[item.priceLabel] || null));
        card.append(evaluated("Seguridad", safetyText(item)));
        card.append(evaluated("Inclinación", incline[item.incline]));
        if (item.suggested) {
          const quote = item.suggested;
          const bit = (label, amount) => label + ": " + (amount == null ? "sin dato" : money.format(amount));
          card.append(line("Precios", [bit("Oferta", quote.oferta), bit("Justo", quote.justo), bit("Extra", quote.extra)].join(" | ")));
        }
        card.append(line("Prioridad", item.priority));
        if (item.reasons.length) card.append(line("Motivo", item.reasons.join(". ")));
        result.append(card);
      }
    }

    async function loadFixtures() {
      const response = await fetch("/api/fixtures");
      const list = await response.json();
      const box = document.querySelector("#fixtures");
      for (const item of list) {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = item.label;
        button.addEventListener("click", async () => {
          error.textContent = "";
          const loaded = await fetch("/api/fixtures/" + item.id);
          const payload = await loaded.json();
          text.value = payload.text;
          capture = null;
          await analyze();
        });
        box.append(button);
      }
    }

    function splitZones(value) {
      return value.split(",").map((item) => item.trim()).filter(Boolean);
    }

    let clockStart = 0;
    let clockTimer = 0;
    let clockLabel = "";
    const elapsed = document.querySelector("#elapsed");
    const elapsedIa = document.querySelector("#elapsed-ia");
    let clockNode = elapsed;
    function paintClock() {
      const value = ((performance.now() - clockStart) / 1000).toFixed(1) + " s";
      clockNode.textContent = clockLabel ? clockLabel + " " + value : value;
    }
    function startClock(node, label) {
      if (clockStart) return false;
      clockNode = node || elapsed;
      clockLabel = label || "";
      if (clockNode === elapsed && !clockLabel) {
        elapsedIa.hidden = true;
        elapsedIa.textContent = "";
      }
      clockStart = performance.now();
      paintClock();
      clockTimer = setInterval(paintClock, 100);
      return true;
    }
    function stopClock(owned) {
      if (!owned || !clockStart) return;
      clearInterval(clockTimer);
      paintClock();
      clockStart = 0;
    }
    function resetClock() {
      clearInterval(clockTimer);
      clockStart = 0;
      clockLabel = "";
      elapsed.textContent = "";
      elapsedIa.textContent = "";
      elapsedIa.hidden = true;
    }
    function localOcr() {
      return document.querySelector("#ocr-mode").value === "local";
    }

    async function analyze() {
      const owned = startClock(localOcr() ? elapsedIa : elapsed, localOcr() ? "IA" : "");
      if (localOcr()) elapsedIa.hidden = false;
      error.textContent = "";
      try {
      const prime = splitZones(document.querySelector("#prime").value);
      const response = await fetch("/api/analyze", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({
          text: text.value,
          context: {
            mode: document.querySelector("#mode").value,
            home: document.querySelector("#home").value,
            contiguousZones: prime.length ? prime : undefined,
            distantZones: splitZones(document.querySelector("#distant").value)
          },
          ocr: document.querySelector("#ocr-mode").value,
          compacto: document.querySelector("#compacto").value === "true",
          vista: document.querySelector("#vista").value,
          image: capture
        })
      });
      const payload = await response.json();
      if (!response.ok) {
        result.replaceChildren();
        error.textContent = payload.error || "No se pudo analizar";
        return;
      }
      render(payload);
      } finally {
        stopClock(owned);
      }
    }

    let capture = null;
    const image = document.querySelector("#image");
    const preview = document.querySelector("#preview");
    const ocrStatus = document.querySelector("#ocr-status");
    document.querySelector("#ocr").addEventListener("click", () => image.click());
    async function useCapture(mime, data, previewSrc) {
      const local = localOcr();
      const owned = startClock(elapsed, local ? "Extracción" : "");
      if (local) {
        elapsedIa.hidden = false;
        elapsedIa.textContent = "";
      }
      error.textContent = "";
      try {
      preview.src = previewSrc;
      preview.classList.add("show");
      ocrStatus.className = "busy";
      ocrStatus.textContent = "Leyendo imagen";
      capture = { mime, data };
      if (!local) {
        text.value = "";
        ocrStatus.textContent = "Enviando imagen";
        await analyze();
        if (!error.textContent) {
          ocrStatus.className = "done";
          ocrStatus.textContent = "Listo";
        }
        return;
      }
      ocrStatus.textContent = "Extrayendo texto";
      const response = await fetch("/api/ocr", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ mime, data }),
      });
      const payload = await response.json();
      if (!response.ok) {
        ocrStatus.className = "";
        ocrStatus.textContent = "";
        error.textContent = payload.error || "No se pudo leer la imagen";
        return;
      }
      text.value = payload.text;
      stopClock(owned);
      ocrStatus.className = "busy";
      ocrStatus.textContent = "Completando campos";
      await analyze();
      if (!error.textContent) {
        ocrStatus.className = "done";
        ocrStatus.textContent = "Texto listo";
      }
      } catch {
        error.textContent = "No se pudo leer la imagen";
      } finally {
        stopClock(owned);
      }
    }
    image.addEventListener("change", async () => {
      const file = image.files && image.files[0];
      image.value = "";
      if (!file) return;
      const dataUrl = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(new Error("lectura"));
        reader.readAsDataURL(file);
      });
      const encoded = String(dataUrl);
      const comma = encoded.indexOf(",");
      await useCapture(file.type || "image/jpeg", encoded.slice(comma + 1), URL.createObjectURL(file));
    });
    document.querySelector("#phone").addEventListener("click", async () => {
      error.textContent = "";
      ocrStatus.className = "busy";
      ocrStatus.textContent = "Capturando teléfono";
      const response = await fetch("/api/phone", { method: "POST" });
      const payload = await response.json();
      if (!response.ok) {
        ocrStatus.className = "";
        ocrStatus.textContent = "";
        error.textContent = payload.error || "No se pudo capturar el teléfono";
        return;
      }
      await useCapture(payload.mime, payload.data, "data:" + payload.mime + ";base64," + payload.data);
    });
    document.querySelector("#analyze").addEventListener("click", analyze);
    document.querySelector("#vista").addEventListener("change", () => {
      if (text.value.trim() || capture) analyze();
    });
    document.querySelector("#clear").addEventListener("click", () => {
      text.value = "";
      capture = null;
      lastData = null;
      result.replaceChildren();
      error.textContent = "";
      preview.removeAttribute("src");
      preview.classList.remove("show");
      ocrStatus.className = "";
      ocrStatus.textContent = "";
      resetClock();
    });
    loadFixtures();
  </script>
</body>
</html>
