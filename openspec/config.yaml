schema: spec-driven

context: |
  Language: spanish
  All artifacts must be written in spanish.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  ## Producto
  Asistente para un conductor de Uber, inDrive y DiDi en Medellín.
  Repo: app-driver-happy.
  Corte vigente en main: lector, precio por km, panel en http://127.0.0.1:3000, km de viaje con MAPBOX_ACCESS_TOKEN (si no está, OpenRouteService y luego Google), modos, zona prime, seguridad por geometría y hora pico. Sin APK. Sin elevación. Ese corte es determinístico.

  ## Ramas
  - main: motor determinístico. Geocodificación, ruta, zonas.geojson y reglas fijas. No usa un modelo generativo para decidir.
  - google-ia: modo Gemini, no determinístico. La misma captura puede no repetir la misma decisión. Es la rama de trabajo de la próxima sesión. La clave de la API de Google todavía no está comprada; el código de esta rama no debe volver al motor de main mientras se espera la clave.

  ## Dónde vive cada cosa
  - Comportamiento que el código cumple: openspec/specs/
  - Requisito de producto aún no implementado: openspec/changes/2026-10-06-requisitos-producto/
  - Narrativa de origen: promp-inicial.md (no es el contrato; el contrato es este árbol).

  ## Stack previsto
  - Android: Kotlin (captura, barra, GPS, OCR).
  - Mac: TypeScript. Umbrales en server/src/thresholds.ts.
  - Mapas: Geocoding, Routes y Elevation en el backend. La clave no va en el APK.

rules:
  proposal:
    - Incluir Non-goals (tienda Play, aceptar solo). En main, la IA generativa no decide seguridad ni pendiente. En google-ia, Gemini sí decide.
    - Separar lo ya cubierto por specs/ de lo que el change propone.
  design:
    - Nombrar la pantalla (uber_sheet, indrive_list, didi_list, didi_modal) y el archivo de umbrales.
  tasks:
    - No marcar hecha una tarea de panel, Android o Google mientras no exista el código.

operations:
  apply:
    guidance:
      - El panel local es http://127.0.0.1:3000 (`npm start` en server/). La suite es `npm test`.
      - No inventar distancia ni precio si el dato no está en la pantalla.
  archive:
    guidance:
      - Al archivar, pasar los delta a openspec/specs/ solo si el código y los tests ya los cumplen.
